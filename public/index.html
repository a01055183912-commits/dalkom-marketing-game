<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}html{-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>달콤상점 마케팅 게임</title>
<meta name="description" content="롯데 LIFT 3-3 고객 세그먼트 및 데이터 마케팅 실습 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFF4F3; --surface2:#F7EEEC; --ink:#2E1F1B; --muted:#7A6560; --line:#EADBD8;
  --berry:#D8394A; --berry-soft:#FBE3E5; --choco:#5A3A31; --matcha:#5E8C3A; --matcha-soft:#E6F0DC;
  --lemon:#E9B21F; --lemon-soft:#FBF1D2; --bad:#C2410C; --good:#3F7D2C;
  --shadow:0 1px 2px rgba(46,31,27,.08),0 6px 18px rgba(46,31,27,.06);
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#1C1412; --surface:#2A1E1B; --surface2:#33241F; --ink:#F6ECE9; --muted:#BCA7A1; --line:#4A3631;
    --berry:#F0626F; --berry-soft:#4A2328; --choco:#E3C3B8; --matcha:#9CC877; --matcha-soft:#2C3A22;
    --lemon:#F2C94C; --lemon-soft:#3F3417; --bad:#FB923C; --good:#9CC877; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#1C1412; --surface:#2A1E1B; --surface2:#33241F; --ink:#F6ECE9; --muted:#BCA7A1; --line:#4A3631;
  --berry:#F0626F; --berry-soft:#4A2328; --choco:#E3C3B8; --matcha:#9CC877; --matcha-soft:#2C3A22;
  --lemon:#F2C94C; --lemon-soft:#3F3417; --bad:#FB923C; --good:#9CC877; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:0 60px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.2px;text-wrap:balance;margin:0}
button{font-family:var(--body);font-size:15px;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand h1{font-size:26px;color:var(--berry)}
.brand small{font-size:12px;color:var(--muted);font-family:var(--body)}
.teams{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.team{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--bg)}
.team.on{border-color:var(--berry);background:var(--berry-soft)}
.team .tn{font-weight:700;font-size:14px;background:none;border:0;padding:0}
.team .ts{font-family:var(--mono);font-weight:600;min-width:28px;text-align:right}
.team .pm{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);line-height:1;padding:0}
.tcount{border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--bg);color:var(--ink);font-family:var(--body)}
/* home */
.hero{padding-block:36px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:48px;align-items:center}
.hero-img{height:340px;width:auto;aspect-ratio:473/591;border-radius:16px;box-shadow:var(--shadow)}
.hero h2{font-size:clamp(34px,5vw,54px);line-height:1.1}
.hero h2 em{font-style:normal;color:var(--berry)}
.hero p{font-size:18px;color:var(--muted);max-width:60ch;margin:14px 0 0}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:22px}
.gcard{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-2px);border-color:var(--berry)}
.gcard .gno{font-family:var(--mono);font-size:12px;color:var(--muted)}
.gcard h3{font-size:22px}
.gcard p{margin:0;color:var(--muted);font-size:14.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--choco);font-weight:500}
.tag.b{background:var(--berry-soft);color:var(--berry)}
.howto{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;font-size:14.5px}
.howto b{display:block;font-family:var(--display);font-weight:400;font-size:19px;color:var(--choco)}
/* screen */
.screen-head{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-block:22px 8px}
.screen-head h2{font-size:clamp(28px,4vw,40px)}
.screen-head .sub{color:var(--muted);flex-basis:100%;margin:0;font-size:16px;max-width:80ch}
.back{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--berry);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn.green{background:var(--matcha)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-block:12px}
.step{font-family:var(--mono);font-size:12px;color:var(--berry);letter-spacing:.8px}
.panel{background:var(--surface);border-radius:14px;padding:16px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50}
/* game1 */
.g1{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ccard{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:112px}
.ccard .id{font-family:var(--display);font-size:22px;color:var(--choco)}
.ccard .d{font-size:13px;display:flex;justify-content:space-between;gap:6px}
.ccard .d span:last-child{font-family:var(--mono)}
.ccard .sc{font-family:var(--mono);font-size:12px;color:var(--berry);margin-top:4px}
.ccard.sel{border-color:var(--berry);box-shadow:0 0 0 3px var(--berry-soft)}
.ccard.placed{opacity:.35}
.ccard.ok{border-color:var(--good);background:var(--matcha-soft);opacity:1}
.ccard.no{border-color:var(--bad);opacity:1;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bins{display:flex;flex-direction:column;gap:8px;position:sticky;top:90px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:10px;background:var(--bg);text-align:left;min-height:64px}
.bin.ready{border-color:var(--berry);border-style:solid}
.bin h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px;display:flex;justify-content:space-between}
.bin .hint{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-family:var(--mono);font-size:12px;border-radius:6px;padding:2px 7px;background:var(--surface2)}
.chip.ok{background:var(--matcha-soft);color:var(--good)}.chip.no{background:#FDE2D4;color:var(--bad)}
.share{margin-top:16px}
.srow{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.strack{height:22px;background:var(--surface2);border-radius:4px;overflow:hidden}
.sfill{height:100%;background:var(--berry);border-radius:4px 0 0 4px;transition:width .6s}
.sfill.low{background:var(--muted)}
/* game2 */
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.opt.on{border-color:var(--berry);background:var(--berry-soft)}
.opt h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:22px}
.opt p{margin:0;font-size:13.5px;color:var(--muted)}
.sl{display:grid;grid-template-columns:170px 1fr 80px;gap:12px;align-items:center;margin:10px 0}
.sl label{font-weight:700;font-size:15px}
.sl label small{display:block;font-weight:400;color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--berry)}
.budget{font-family:var(--mono);font-size:15px}
.budget.over{color:var(--bad);font-weight:600}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:12px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600}
.kpi.hl .v{color:var(--berry)}
.fb{margin:12px 0 0;padding-left:20px}
.fb li{margin:5px 0}
/* game3 */
.crm{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
.seg3{border-bottom:1px solid var(--line);padding:10px 0}
.seg3 .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.seg3 .h b{font-family:var(--display);font-weight:400;font-size:21px}
.seg3 .cap{font-size:12.5px;color:var(--muted)}
.seg3 .cap.over{color:var(--bad);font-weight:700}
.seg3 input{margin-top:4px}
.seg3 .val{font-family:var(--mono)}
.gauge{height:14px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:6px}
.gauge div{height:100%;background:var(--matcha)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono)}
/* game4 */
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14.5px}
.act.sel{border-color:var(--berry);background:var(--berry-soft)}
.act.placed{opacity:.3}
.segs4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.s4{border:2px dashed var(--line);border-radius:12px;padding:10px;background:var(--bg);text-align:left;min-height:150px;display:flex;flex-direction:column;gap:6px}
.s4.ready{border-color:var(--berry);border-style:solid}
.s4 h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.s4 .goal{font-size:12.5px;color:var(--muted)}
.s4 .in{font-size:13.5px;border-radius:8px;padding:5px 8px;background:var(--surface2)}
.s4 .in.ok{background:var(--matcha-soft);color:var(--good)}.s4 .in.no{background:#FDE2D4;color:var(--bad);text-decoration:line-through}
.s4 input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-family:var(--body);font-size:13.5px;background:var(--bg);color:var(--ink)}
.trash{border-color:var(--muted)}
/* game5 */
.quiz{display:grid;grid-template-columns:1fr;gap:14px;max-width:900px}
.qnum{font-family:var(--mono);color:var(--berry)}
.q{font-family:var(--display);font-size:clamp(26px,3.6vw,38px);line-height:1.25}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:17px}
.choice.ok{border-color:var(--good);background:var(--matcha-soft)}
.choice.no{opacity:.5}
.explain{background:var(--lemon-soft);border-radius:12px;padding:14px 16px;font-size:16px}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who button{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--bg)}
.who button.on{background:var(--matcha);color:#fff;border-color:var(--matcha)}
.first{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-top:10px}
.big{text-align:left;border:0;border-radius:16px;padding:22px;background:var(--berry);color:#fff;display:flex;flex-direction:column;gap:8px}
.big.alt{background:var(--choco);color:var(--bg)}
.big h3{font-size:34px}.big p{margin:0;opacity:.92;font-size:15px}.big .gno{font-family:var(--mono);font-size:12px;opacity:.85}
.wsbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-block:6px 10px}
.lab{font-weight:700;font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sopt{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:700}
.sopt.on{background:var(--berry);border-color:var(--berry);color:#fff}
.sync{font-size:13px;color:var(--good);margin-left:auto}
.wstabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.wtab{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 11px;font-size:14px}
.wtab.on{border-color:var(--berry);background:var(--berry-soft);font-weight:700}
.prog{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}.prog.full{color:var(--good)}
.wshead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:8px}
.wshead h3{font-size:28px}.wshead p{margin:4px 0 0;max-width:80ch}
.pill{background:var(--berry);color:#fff;border-radius:999px;padding:5px 16px;font-weight:700;white-space:nowrap}
.tipline{background:var(--surface);border-radius:8px;padding:9px 12px;font-size:14px;margin:6px 0 12px}
.tscroll{overflow-x:auto;margin-bottom:14px}
table.wt,table.ct{border-collapse:collapse;width:100%;min-width:760px;font-size:14px;table-layout:fixed}
.wt th,.ct th{background:var(--berry-soft);text-align:left;padding:8px;border:1px solid var(--line);font-weight:700;font-size:13.5px}
.wt td,.ct td{border:1px solid var(--line);padding:4px;vertical-align:top}
.ct td{padding:8px;white-space:pre-wrap}
.wt td.fx,.ct td.fx{background:var(--surface);font-weight:700;padding:8px;font-size:13.5px}
.wt td.cv{background:var(--lemon-soft);padding:8px;font-weight:600}
.wt tr.tot td{border-top:2px solid var(--ink)}
.wi{width:100%;border:0;background:transparent;font-family:var(--body);font-size:14px;color:var(--ink);padding:6px;resize:vertical;line-height:1.45}
.wi:focus{background:var(--lemon-soft);outline:2px solid var(--lemon)}
.wi.num{text-align:center;font-family:var(--mono)}
.wf{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.wf label{font-weight:700;font-size:14px}
.wf .wi{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.calcbox{background:var(--lemon-soft);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.calcrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0;border-bottom:1px dashed var(--line)}
.warn{color:var(--bad);font-weight:700}
.tog{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px}
.ansh,.ansc{background:var(--matcha-soft)!important}
.ro{padding:6px;white-space:pre-wrap}
.guide{background:var(--surface);border-radius:14px;padding:4px 18px;margin:10px 0 16px;border:1.5px solid var(--line)}
.guide[open]{padding-bottom:14px}
.guide summary{cursor:pointer;font-family:var(--display);font-size:21px;color:var(--berry);padding:10px 0;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary:before{content:"＋ ";color:var(--muted)}.guide[open] summary:before{content:"－ "}
.ggoal{margin:0 0 12px;font-size:16px;font-weight:500}
.gcols{display:grid;grid-template-columns:1fr 1.15fr;gap:22px}
.gh{display:block;font-size:14px;color:var(--choco);margin:6px 0 6px;letter-spacing:.3px}
.guide ol,.guide ul{margin:0 0 8px;padding-left:20px;font-size:14.5px}.guide li{margin:5px 0}
.gform{background:var(--lemon-soft);border-radius:8px;padding:9px 12px;font-size:14px;font-weight:500;margin:8px 0 0}
.gex{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.gex b{font-size:14px;color:var(--berry)}.gex p{margin:4px 0 0;font-size:14.5px}
table.gt{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 12px;background:var(--bg)}
.gt th{background:var(--berry-soft);text-align:left;padding:7px 9px;border:1px solid var(--line)}
.gt td{border:1px solid var(--line);padding:7px 9px}
.exbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.exa{font-size:12.5px;color:var(--good);background:var(--matcha-soft);border-radius:6px;padding:4px 7px;margin:3px 2px 2px;line-height:1.4}
@media (max-width:860px){.gcols{grid-template-columns:1fr}}
.big.mid{background:var(--matcha);color:#fff}
.rwrap{max-width:1100px}
.rlead{font-size:17px;margin:4px 0 14px}
.rh{font-size:24px;margin:22px 0 8px}
.rsteps{font-size:17px;margin:0 0 10px;padding-left:22px}.rsteps li{margin:4px 0}
.rwarn{background:var(--berry-soft);color:var(--berry);border-radius:10px;padding:10px 14px;font-size:16px}
table.rt{min-width:620px;font-size:15.5px;table-layout:auto}
.rt td{padding:10px}.rt td.c{text-align:center}
.rt.all td.sc{background:var(--berry-soft);text-align:center;font-weight:600}
.rt.all tr{cursor:pointer}.rt.all tr:hover td{background:var(--lemon-soft)}
.rt tr.rowpick td{outline:2px solid var(--berry);outline-offset:-2px}
.sv{color:var(--berry)}.sr{color:var(--bad)}
.pickrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pickrow .sopt{padding:6px 11px;font-family:var(--mono);font-size:14px}
.pickrow .sopt.star:not(.on){border-color:var(--berry)}
.rcols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rcol h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:19px}
.rgrp{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;background:var(--bg)}
.rgrp.hit{border-color:var(--berry);background:var(--berry-soft)}
.rpt{font-family:var(--mono);font-weight:600;min-width:26px;color:var(--muted)}.rgrp.hit .rpt{color:var(--berry)}
.rids{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:13.5px}
.rids small{color:var(--muted);margin-left:1px}
.rids .me{color:var(--berry);font-weight:600;text-decoration:underline}
.rresult{display:grid;grid-template-columns:repeat(3,auto);gap:10px 26px;align-items:end;background:var(--surface);border-radius:12px;padding:14px 18px;margin-top:10px}
.rresult div{display:flex;flex-direction:column;gap:2px}.rresult .rbig{font-size:26px}
.rresult p{grid-column:1/-1;margin:0;font-size:16px}
@media (max-width:860px){.rcols{grid-template-columns:1fr}.rresult{grid-template-columns:1fr}}
.tbtn{border:0;background:var(--choco);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}

<body>
<header class="top">
  <div class="top-in">
    <button class="brand" id="homeBtn" aria-label="처음 화면으로"><h1>달콤상점</h1><small>3-3 고객 세그먼트 · 데이터 마케팅 게임</small></button>
    <button class="tbtn" onclick="go('teacher')">강사 화면</button>
    <div class="teams" id="teams"></div>
    <label class="muted" style="font-size:13px">조 수
      <select class="tcount" id="tcount"><option>3</option><option selected>4</option></select>
    </label>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------------- state & teams ---------------- */
const S={teams:4,scores:[0,0,0,0,0,0],cur:0};
try{const s=JSON.parse(localStorage.getItem('dalkom-score4')||'null');if(s){Object.assign(S,s)}}catch(e){}
function save(){try{localStorage.setItem('dalkom-score4',JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
function renderTeams(){
  const box=$('#teams');box.innerHTML='';
  for(let i=0;i<S.teams;i++){
    const d=document.createElement('div');d.className='team'+(i===S.cur?' on':'');
    d.innerHTML=`<button class="tn" title="지금 차례인 조로 선택">${i+1}조</button><span class="ts num">${S.scores[i]}</span><button class="pm" aria-label="${i+1}조 1점 빼기">−</button><button class="pm" aria-label="${i+1}조 1점 더하기">+</button>`;
    const [tn,,m,p]=d.children;
    tn.onclick=()=>{S.cur=i;save();renderTeams()};
    m.onclick=()=>{S.scores[i]--;save();renderTeams();pushScores()};
    p.onclick=()=>{S.scores[i]++;save();renderTeams();pushScores()};
    box.appendChild(d);
  }
  $('#tcount').value=S.teams;
}
$('#tcount').onchange=e=>{S.teams=+e.target.value;if(S.cur>=S.teams)S.cur=0;save();renderTeams();pushScores();if($('#compareBody'))comparePage();if($('#wsbody'))wsPage()};
function award(n,why){S.scores[S.cur]+=n;save();renderTeams();pushScores();toast(`${S.cur+1}조 +${n}점 · ${why}`)}
const won=n=>Math.round(n).toLocaleString('ko-KR');

/* ---------------- home ---------------- */
const GAMES=[
 {id:'g2',no:'게임 1',t:'디저트 가게 사장 되기',d:'와그작 케이크 또는 과일모찌 가게를 골라 손님 무리를 정하고, 광고비 100만 원을 나눠 써 봅니다. 한 달 뒤 손님 수와 매출은 앱이 계산합니다.',tags:['STP','실습 0-1 대신','15분'],b:0},
 {id:'g1',no:'게임 2',t:'손님 카드 분류',d:'고객 20명 카드를 다섯 바구니에 나눠 담습니다. R·F·M 점수 계산은 앱이 해 주고, 조는 "이 손님은 누구인가"만 판단합니다.',tags:['RFM','실습 ④ · ④-2 대신','25분'],b:1},
 {id:'g4',no:'게임 3',t:'누구에게 무엇을?',d:'CRM 액션 카드를 알맞은 등급에 붙이고, 할인 쿠폰 말고 우리 조만의 새 아이디어를 한 줄씩 적습니다.',tags:['CRM 액션','실습 ⑤ 대신','15분'],b:0},
 {id:'g3',no:'게임 4',t:'CRM 예산 나누기',d:'624만 원을 다섯 등급에 슬라이더로 나눕니다. LTV 한도를 넘으면 경고가 뜨고, 1년 뒤 기대 효과가 바로 계산됩니다.',tags:['LTV','실습 ⑥ 대신','15분'],b:0},
 {id:'g5',no:'게임 5',t:'마케팅 골든벨',d:'오늘 배운 STP · RFM · CRM · LTV를 12문제로 복습합니다. 맞힌 조를 눌러 점수를 줍니다.',tags:['복습','사후평가 대비','15분'],b:0},
];
function home(){
  $('#app').innerHTML=`
  <section class="hero">
    <div>
      <p class="step">LOTTE LIFT · 3-3 실습</p>
      <h2>우리 가게 단골은<br><em>누구일까요?</em></h2>
      <p>조별로 실습지를 먼저 쓰고, 다섯 개의 게임으로 확인합니다. 계산이 필요한 칸은 앱이 대신 채웁니다. 게임을 할 때는 위쪽 점수판에서 차례인 조를 먼저 누르세요.</p>
    </div>
    <img class="hero-img" src="/shop.jpg" alt="달콤상점 와그작 케이크와 과일모찌" width="473" height="591">
  </section>
  <div class="first">
    <button class="big" onclick="go('ws')"><span class="gno">먼저 · 조별로 한 대씩</span><h3>실습지 쓰기</h3><p>실습 0-1부터 ⑦ 원페이퍼까지 8장을 조별로 채웁니다. 합계 · LTV 같은 계산은 앱이 하고, ⑦은 앞에서 쓴 내용을 불러옵니다.</p></button>
    <button class="big mid" onclick="go('rfm')"><span class="gno">실습 ④ 준비</span><h3>RFM 표 읽기</h3><p>C01~C20이 무엇인지, 숫자를 점수로 바꾸는 법, 20명 한눈에 보기. 손님을 누르면 따라가기만 하면 됩니다.</p></button>
    <button class="big alt" onclick="go('teacher')"><span class="gno">강사 전용</span><h3>강사 화면</h3><p>오늘 진행 순서 · 실습별 예시 답안과 해설 · 조별 모아보기 · 게임 정답을 한곳에서 봅니다.</p></button>
  </div>
  <p class="step" style="margin-top:26px">게임 · 실습지를 쓰기 전 몸풀기나 쓰고 난 뒤 확인용</p>
  <div class="games" id="games"></div>
  <div class="howto">
    <div><b>진행 방법</b>강사 화면에 띄우고, 조가 돌아가며 선택합니다. 차례인 조를 점수판에서 먼저 누르세요.</div>
    <div><b>점수</b>게임마다 "점수 넣기" 버튼이 차례인 조에 점수를 줍니다. + / − 로 직접 고칠 수도 있습니다.</div>
    <div><b>데이터</b>고객 20명 · 디저트 가게 숫자는 계산 연습용 가상 데이터입니다. 디저트 트렌드는 2026년 기사 기준입니다.</div>
  </div>`;
  const g=$('#games');
  GAMES.forEach(x=>{const b=document.createElement('button');b.className='gcard';
    b.innerHTML=`<span class="gno">${x.no}</span><h3>${x.t}</h3><p>${x.d}</p><div class="tags">${x.tags.map((t,i)=>`<span class="tag ${i===0?'b':''}">${t}</span>`).join('')}</div>`;
    b.onclick=()=>go(x.id);g.appendChild(b)});
}
function head(t,sub,step){return `<div class="screen-head"><button class="back" onclick="go('home')">← 게임 목록</button><div><p class="step">${step}</p><h2>${t}</h2></div><p class="sub">${sub}</p></div>`}
function go(id){({home,g1,g2,g3,g4,g5,ws:wsPage,cmp:comparePage,rfm:rfmPage,teacher:teacherPage})[id]();if(GGUIDE[id]){const sh=document.querySelector('.screen-head');if(sh)sh.insertAdjacentHTML('afterend',guideHTML(GGUIDE[id],false))}window.scrollTo(0,0)}
$('#homeBtn').onclick=()=>go('home');

/* ---------------- game 1 : RFM ---------------- */
const CUST=[["C01",12,18,4200],["C02",25,14,3100],["C03",8,22,5600],["C04",45,9,1800],["C05",120,3,620],["C06",15,11,2400],["C07",210,2,380],["C08",33,7,1250],["C09",5,16,3800],["C10",95,4,850],["C11",60,6,1100],["C12",18,13,2900],["C13",300,1,150],["C14",40,5,700],["C15",22,8,1600],["C16",150,2,300],["C17",10,20,4800],["C18",75,5,950],["C19",28,10,2100],["C20",180,3,520]];
const SEGS=[
 {k:'vip',n:'최우수 (VIP)',h:'최근에 · 자주 · 많이'},
 {k:'good',n:'우수 단골',h:'활발하지만 아직 최상위는 아님'},
 {k:'grow',n:'일반 (성장 여지)',h:'최근에 왔지만 빈도 · 금액이 낮음'},
 {k:'risk',n:'이탈 위험',h:'예전엔 괜찮았는데 발길이 끊김'},
 {k:'sleep',n:'휴면',h:'오래 안 오고, 적게 샀음'}];
const ANS={C01:'vip',C03:'vip',C09:'vip',C17:'vip',C02:'good',C06:'good',C12:'good',C19:'good',C04:'grow',C08:'grow',C14:'grow',C15:'grow',C05:'risk',C10:'risk',C11:'risk',C18:'risk',C07:'sleep',C13:'sleep',C16:'sleep',C20:'sleep'};
function quintile(){ // 5분위: 4명씩
  const sc={};CUST.forEach(c=>sc[c[0]]={});
  const rank=(key,cmp)=>{const a=[...CUST].sort(cmp);a.forEach((c,i)=>sc[c[0]][key]=5-Math.floor(i/4))};
  rank('R',(a,b)=>a[1]-b[1]);
  rank('F',(a,b)=>b[2]-a[2]||b[3]-a[3]);
  rank('M',(a,b)=>b[3]-a[3]);
  return sc;
}
const G1={sel:null,place:{},showScore:false,checked:false};
function g1(){
  G1.sel=null;G1.place={};G1.showScore=false;G1.checked=false;
  $('#app').innerHTML=head('손님 카드 분류','카드를 누르고 → 바구니를 누르면 들어갑니다. 한 조가 5장씩 돌아가며 넣어도 좋습니다. 막히면 "앱이 점수 계산" 버튼을 누르세요.','게임 2 · RFM · 실습 ④ · ④-2')+`
  <div class="bar"><button class="btn ghost" id="scoreBtn">앱이 R·F·M 점수 계산하기</button><button class="btn" id="checkBtn">채점하기</button><button class="btn ghost" id="resetBtn">다시 하기</button><button class="btn ghost" onclick="go('rfm')">표 읽는 법 보기</button><span class="note">경과일 = 마지막 구매 후 지난 날 · 금액 단위 만원 · 계산 연습용 가상 데이터</span></div>
  <div class="g1"><div><div class="cards" id="cards"></div><div class="share panel" id="share" hidden></div></div><div class="bins" id="bins"></div></div>`;
  $('#scoreBtn').onclick=()=>{G1.showScore=!G1.showScore;$('#scoreBtn').textContent=G1.showScore?'점수 숨기기':'앱이 R·F·M 점수 계산하기';draw1()};
  $('#checkBtn').onclick=check1;$('#resetBtn').onclick=g1;
  draw1();
}
function draw1(){
  const sc=quintile();const cards=$('#cards');cards.innerHTML='';
  CUST.forEach(([id,d,f,m])=>{
    const b=document.createElement('button');const p=G1.place[id];
    b.className='ccard'+(G1.sel===id?' sel':'')+(p&&!G1.checked?' placed':'')+(G1.checked&&p?(ANS[id]===p?' ok':' no'):'');
    b.innerHTML=`<span class="id">${id}</span><span class="d"><span>최근 구매</span><span>${d}일 전</span></span><span class="d"><span>구매 횟수</span><span>${f}회</span></span><span class="d"><span>구매 금액</span><span>${won(m)}</span></span>${G1.showScore?`<span class="sc">R${sc[id].R} · F${sc[id].F} · M${sc[id].M}</span>`:''}`;
    b.onclick=()=>{if(G1.checked)return;G1.sel=G1.sel===id?null:id;draw1()};
    cards.appendChild(b);
  });
  const bins=$('#bins');bins.innerHTML='';
  SEGS.forEach(s=>{const b=document.createElement('button');b.className='bin'+(G1.sel?' ready':'');
    const ids=Object.keys(G1.place).filter(k=>G1.place[k]===s.k);
    b.innerHTML=`<h4><span>${s.n}</span><span class="num" style="font-size:14px">${ids.length}명</span></h4><span class="hint">${s.h}</span><div class="chips">${ids.map(i=>`<span class="chip ${G1.checked?(ANS[i]===s.k?'ok':'no'):''}">${i}</span>`).join('')}</div>`;
    b.onclick=()=>{if(!G1.sel||G1.checked)return;G1.place[G1.sel]=s.k;G1.sel=null;draw1()};
    bins.appendChild(b)});
}
function check1(){
  const n=Object.keys(G1.place).length;
  if(n<20){toast(`아직 ${20-n}장이 남았습니다`);return}
  G1.checked=true;G1.showScore=true;draw1();
  const ok=CUST.filter(c=>ANS[c[0]]===G1.place[c[0]]).length;
  const pts=ok>=18?5:ok>=15?3:ok>=10?2:1;
  const tot=CUST.reduce((a,c)=>a+c[3],0);
  const segSum=SEGS.map(s=>({n:s.n,v:CUST.filter(c=>ANS[c[0]]===s.k).reduce((a,c)=>a+c[3],0)}));
  const sh=$('#share');sh.hidden=false;
  sh.innerHTML=`<h3 style="font-size:24px">${ok} / 20 정답</h3>
   <p class="muted" style="margin:4px 0 10px">틀린 카드는 빨간 테두리로 표시됩니다. 초록은 정답입니다.</p>
   <b>등급별 매출 비중 · 전체 ${won(tot)}만 원</b>
   ${segSum.map((s,i)=>`<div class="srow"><span>${s.n}</span><div class="strack"><div class="sfill ${i>=3?'low':''}" style="width:${(s.v/tot*100).toFixed(1)}%"></div></div><span class="num">${(s.v/tot*100).toFixed(1)}%</span></div>`).join('')}
   <ul class="fb">
    <li><b>상위 4명(20%)이 매출의 47.0%</b>를 만들고, 휴면 4명은 3.5%입니다. 약 13.6배 차이, 예산을 등급별로 다르게 써야 하는 이유입니다.</li>
    <li><b>C11(합계 8점)</b>은 R이 2로 떨어진 이탈 위험, <b>C15(합계 10점)</b>는 R이 4로 살아 있는 성장 후보입니다. 합계보다 R을 먼저 봅니다.</li>
    <li>가장 먼저 연락할 사람은 C11입니다. 복귀 쿠폰보다 마지막 구매 카테고리와 불만 기록부터 확인합니다.</li>
   </ul>
   <div class="bar"><button class="btn green" id="aw1">${S.cur+1}조에 ${pts}점 넣기</button></div>`;
  $('#aw1').onclick=e=>{award(pts,`카드 ${ok}장 정답`);e.target.disabled=true};
}

/* ---------------- game 2 : dessert shop ---------------- */
const DESS=[
 {k:'wag',n:'와그작 케이크',p:'과일 모양 초콜릿 껍질을 깨면 무스와 과일이 나오는 케이크',fact:'뚜레쥬르 "아그작" 오픈런, CU "깨먹는" 빵 3개월 110만 개 (2026)'},
 {k:'mochi',n:'과일모찌',p:'찹쌀떡 안에 크림과 제철 생과일을 통째로 넣은 디저트',fact:'신세계 센텀시티 "모찌모찌" 팝업 웨이팅 (2026.7)'}];
const TGT=[
 {k:'shot',n:'20대 인증샷 손님',p:'친구와 주말 나들이 · 찍어서 올릴 장면을 찾음'},
 {k:'teen',n:'10대 학생',p:'방과 후 · 친구들 사이 화제가 되는 것'},
 {k:'gift',n:'40·50대 선물 손님',p:'명절 · 방문 인사 · 포장과 격을 봄'},
 {k:'kid',n:'30·40대 부모',p:'아이 생일 · 간식 · 안심하고 먹일 것'}];
const CH=[
 {k:'reels',n:'인스타 릴스 광고',s:'짧은 영상 · SNS'},
 {k:'event',n:'체험 · 시식 이벤트',s:'직접 깨 보기 · 맛보기'},
 {k:'pack',n:'선물 포장 고급화',s:'박스 · 보자기 · 메시지 카드'},
 {k:'local',n:'맘카페 · 지역 커뮤니티',s:'동네 입소문'},
 {k:'crm',n:'단골 문자 · 적립',s:'재방문 관리'}];
const FIT={wag:{shot:1,teen:.8,gift:.4,kid:.7},mochi:{shot:.6,teen:.4,gift:1,kid:.7}};
const SPEND={wag:{shot:12000,teen:8000,gift:20000,kid:18000},mochi:{shot:10000,teen:6000,gift:35000,kid:15000}};
const AFF={shot:[1,.8,.2,.1,.3],teen:[.9,.6,0,.1,.1],gift:[.2,.3,1,.5,.7],kid:[.3,.7,.3,1,.5]};
const G2={d:null,t:null,b:[20,20,20,20,20],done:false};
function g2(){
  G2.d=null;G2.t=null;G2.b=[20,20,20,20,20];G2.done=false;
  $('#app').innerHTML=head('디저트 가게 사장 되기','① 디저트를 고르고 ② 손님 무리 하나를 고른 뒤 ③ 광고비 100만 원을 나눠 쓰세요. 한 달 뒤 결과는 앱이 계산합니다.','게임 1 · STP · 실습 0-1')+`
  <p class="step" style="margin-top:14px">① 우리 가게 디저트</p><div class="picker" id="pd"></div>
  <p class="step" style="margin-top:18px">② 우리가 고를 손님 무리 (Targeting)</p><div class="picker" id="pt"></div>
  <p class="step" style="margin-top:18px">③ 광고비 100만 원 나누기</p>
  <div class="panel"><div id="sls"></div><div class="bar"><span class="budget num" id="bud"></span><button class="btn" id="run">한 달 영업해 보기</button></div><div id="out"></div></div>
  <p class="note" style="margin-top:10px">결과 숫자는 교육용 가상 모델로 계산합니다. 손님 무리마다 잘 반응하는 채널이 다르고, 디저트와 손님이 잘 맞을수록 효과가 큽니다.</p>`;
  const pd=$('#pd');DESS.forEach(x=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<h4>${x.n}</h4><p>${x.p}</p><p style="margin-top:6px">${x.fact}</p>`;b.onclick=()=>{G2.d=x.k;[...pd.children].forEach(c=>c.classList.remove('on'));b.classList.add('on')};pd.appendChild(b)});
  const pt=$('#pt');TGT.forEach(x=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<h4>${x.n}</h4><p>${x.p}</p>`;b.onclick=()=>{G2.t=x.k;[...pt.children].forEach(c=>c.classList.remove('on'));b.classList.add('on')};pt.appendChild(b)});
  const sls=$('#sls');CH.forEach((c,i)=>{const d=document.createElement('div');d.className='sl';
    d.innerHTML=`<label for="ch${i}">${c.n}<small>${c.s}</small></label><input type="range" id="ch${i}" min="0" max="100" step="5" value="${G2.b[i]}"><span class="num" id="cv${i}">${G2.b[i]}만 원</span>`;

function bud(){const s=G2.b.reduce((a,c)=>a+c,0);const el=$('#bud');el.textContent=`쓴 돈 ${s} / 100만 원`+(s>100?' · 예산 초과!':s<100?` · ${100-s}만 원 남음`:'');el.className='budget num'+(s>100?' over':'');$('#run').disabled=s>100}
function sim(d,t,b){
  const fit=FIT[d][t],aff=AFF[t];
  let reach=0;b.forEach((x,i)=>reach+=40*Math.sqrt(x)*aff[i]);
  const visitors=Math.round(300+reach*fit*(d==='mochi'&&b[2]>0&&t==='gift'?1.15:1));
  const rev=.15+.2*Math.sqrt(b[4]/100)*aff[4]+.1*Math.sqrt(b[1]/100)*aff[1];
  const sales=visitors*SPEND[d][t]*(1+rev);
  const profit=sales*.3-b.reduce((a,c)=>a+c,0)*10000;
  return {visitors,rev,sales,profit,fit};
}
function run2(){
  if(!G2.d||!G2.t){toast('디저트와 손님 무리를 먼저 고르세요');return}
  const r=sim(G2.d,G2.t,G2.b);const aff=AFF[G2.t];
  // best possible for comparison (simple search)
  let best=null;for(let a=0;a<=100;a+=10)for(let b=0;b<=100-a;b+=10)for(let c=0;c<=100-a-b;c+=10)for(let d=0;d<=100-a-b-c;d+=10){const e=100-a-b-c-d;const x=sim(G2.d,G2.t,[a,b,c,d,e]);if(!best||x.profit>best.profit)best={...x,b:[a,b,c,d,e]}}
  const fb=[];
  const maxI=G2.b.indexOf(Math.max(...G2.b));
  if(aff[maxI]<.4)fb.push(`<b>${CH[maxI].n}</b>에 가장 많이 썼는데, ${TGT.find(x=>x.k===G2.t).n}은 여기에 잘 반응하지 않습니다.`);
  const topI=aff.indexOf(Math.max(...aff));
  if(G2.b[topI]<30)fb.push(`이 손님이 가장 잘 반응하는 곳은 <b>${CH[topI].n}</b>입니다. 여기에 더 실어 보세요.`);
  if(r.fit<.6)fb.push(`디저트와 손님이 잘 안 맞습니다. ${DESS.find(x=>x.k===G2.d).n}을 이 손님이 살 이유를 한 줄로 말할 수 있나요?`);
  if(G2.b[4]===0)fb.push('단골 관리에 0원을 썼습니다. 한 번 온 손님이 다시 올 이유가 없습니다.');
  if(!fb.length)fb.push('타깃 · 디저트 · 채널이 잘 맞습니다. 이 조합을 한 줄 포지셔닝으로 적어 보세요.');
  const ratio=best.profit>0?r.profit/best.profit:0;
  const pts=ratio>=.9?3:ratio>=.7?2:1;
  $('#out').innerHTML=`<div class="res">
    <div class="kpi"><div class="k">한 달 손님 수</div><div class="v">${won(r.visitors)}명</div></div>
    <div class="kpi"><div class="k">다시 온 비율</div><div class="v">${Math.round(r.rev*100)}%</div></div>
    <div class="kpi"><div class="k">한 달 매출</div><div class="v">${won(r.sales/10000)}만</div></div>
    <div class="kpi hl"><div class="k">남은 돈 (이익 30% − 광고비)</div><div class="v">${won(r.profit/10000)}만</div></div></div>
    <ul class="fb">${fb.map(x=>`<li>${x}</li>`).join('')}</ul>
    <p class="note">같은 디저트 · 같은 손님으로 낼 수 있는 최고 이익은 약 ${won(best.profit/10000)}만 원 (${best.b.map((x,i)=>CH[i].n.split(' ')[0]+' '+x).join(' · ')}). 우리 조는 그 ${Math.max(0,Math.round(ratio*100))}% 수준입니다.</p>
    <div class="bar"><button class="btn green" id="aw2">${S.cur+1}조에 ${pts}점 넣기</button></div>`;
  $('#aw2').onclick=e=>{award(pts,'디저트 가게 결과');e.target.disabled=true};
}

  const sc=quintile();const L=rankLists();const p=RP.pick;const c=CUST.find(x=>x[0]===p);
  const col=(key,arr,title,unit,idx)=>`<div class="rcol"><h4>${title}</h4>${[5,4,3,2,1].map(pt=>{const grp=arr.slice((5-pt)*4,(5-pt)*4+4);const hit=grp.some(g=>g[0]===p);
     return `<div class="rgrp ${hit?'hit':''}"><span class="rpt">${key}${pt}</span><span class="rids">${grp.map(g=>`<span class="${g[0]===p?'me':''}">${g[0]}<small>(${idx===3?won(g[3]):g[idx]}${unit})</small></span>`).join('')}</span></div>`}).join('')}</div>`;
  const s=sc[p];
  $('#rbody').innerHTML=`<div class="rwrap">
   <p class="rlead">손님 번호를 누르면, 세 줄 세우기 표에서 그 손님이 어느 줄(몇 점)에 있는지 빨간색으로 표시됩니다.</p>
   <div class="pickrow" id="pick"></div>
   <div class="rcols">${col('R',L.R,'① R · 경과일 짧은 순','일',1)}${col('F',L.F,'② F · 횟수 많은 순','회',2)}${col('M',L.M,'③ M · 금액 큰 순','만',3)}</div>
   <div class="rresult"><div><span class="muted">${p}의 값</span><b class="num">${c[1]}일 전 · ${c[2]}회 · ${won(c[3])}만 원</b></div>
    <div><span class="muted">점수</span><b class="num rbig">R${s.R} · F${s.F} · M${s.M}</b></div>
    <div><span class="muted">등급</span><b class="rbig ${ANS[p]==='vip'?'sv':ANS[p]==='risk'?'sr':''}">${SEGNAME[ANS[p]]}</b></div>
    <p>${RFM_WHY[p]}</p></div>
   ${p==='C05'||p==='C20'?`<p class="note">F 동점: C05와 C20은 둘 다 3회 → 금액이 큰 C05(620만)를 앞에 둡니다. 그래서 C05는 F2, C20은 F1입니다.</p>`:''}
   ${p==='C14'||p==='C18'?`<p class="note">F 동점: C14와 C18은 둘 다 5회라 둘 다 F2입니다.</p>`:''}
   <p class="note">수업에서는 C01 · C05 · C11 · C15 네 명만 같이 찾아보고, 나머지는 ③ 한눈에 보기로 확인하면 충분합니다.</p></div>`;
  const pk=$('#pick');CUST.forEach(([id])=>{const b=document.createElement('button');b.className='sopt'+(id===p?' on':'')+(['C01','C05','C11','C15'].includes(id)?' star':'');b.textContent=id;b.onclick=()=>{RP.pick=id;rFollow()};pk.appendChild(b)});
}
function rAll(){
  const sc=quintile();
  $('#rbody').innerHTML=`<div class="rwrap"><div class="bar"><label class="tog"><input type="checkbox" id="hideTog" ${RP.hide?'checked':''}> 점수 · 등급 가리기 (교육생이 먼저 풀 때)</label></div>
   <div class="tscroll"><table class="wt rt all"><thead><tr><th>고객</th><th>경과일<br><small>마지막 구매</small></th><th>R</th><th>횟수<br><small>1년</small></th><th>F</th><th>금액<br><small>만원</small></th><th>M</th><th>등급</th><th>한 줄 해석</th></tr></thead><tbody>
   ${CUST.map(([id,d,f,m])=>{const s=sc[id];const h=RP.hide;const seg=ANS[id];
     return `<tr class="${RP.pick===id?'rowpick':''}" data-id="${id}"><td class="fx">${id}</td><td class="num c">${d}일 전</td><td class="sc num">${h?'?':s.R}</td><td class="num c">${f}회</td><td class="sc num">${h?'?':s.F}</td><td class="num c">${won(m)}</td><td class="sc num">${h?'?':s.M}</td><td><b class="${seg==='vip'?'sv':seg==='risk'?'sr':''}">${h?'?':SEGNAME[seg]}</b></td><td>${h?'':RFM_WHY[id]}</td></tr>`}).join('')}
   </tbody></table></div><p class="note">R은 경과일이 짧을수록 5점 · F는 횟수가 많을수록 5점 · M은 금액이 클수록 5점 (20명을 4명씩 끊은 5분위). 줄을 누르면 ② 계산 따라하기에서 그 손님을 보여 줍니다.</p></div>`;
  $('#hideTog').onchange=e=>{RP.hide=e.target.checked;rAll()};
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{RP.pick=tr.dataset.id;RP.tab='follow';rfmPage()});
}

function guideHTML(g,open){
  if(!g)return '';
  const t=g.table?`<table class="gt"><thead><tr>${(g.tableHead||['이런 손님','이름','장부의 누구'] ).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${g.table.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'';
  return `<details class="guide" ${open?'open':''}><summary>처음이라면 · 예시로 이해하기</summary>
   <p class="ggoal">${g.goal}</p>
   <div class="gcols"><div><b class="gh">이렇게 진행합니다</b><ol>${g.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${g.formula?`<p class="gform">${g.formula}</p>`:''}</div>
   <div><b class="gh">예시로 보면</b>${g.worked.map(([h,d])=>`<div class="gex"><b>${h}</b><p>${d}</p></div>`).join('')}</div></div>
   ${t}${g.mistakes&&g.mistakes.length?`<b class="gh">자주 나오는 실수와 강사 한마디</b><ul>${g.mistakes.map(m=>`<li>${m}</li>`).join('')}</ul>`:''}</details>`;
}

const W={db:null,mode:'local',vals:{},myteam:0,showAns:false,showEx:false,cur:'w01',timers:{},unsub:null,sync:'이 기기에만 저장 중'};
try{W.myteam=+(localStorage.getItem('dalkom-myteam')||0)}catch(e){}
function teamKey(i){return 'team'+(i+1)}
function localLoad(){try{return JSON.parse(localStorage.getItem('dalkom-ws')||'{}')}catch(e){return{}}}
function localSave(){try{localStorage.setItem('dalkom-ws',JSON.stringify(W.vals))}catch(e){}}
W.vals=localLoad();
function getV(t,ws,k){return ((W.vals[teamKey(t)]||{})[ws]||{})[k]??''}
function setV(t,ws,k,v){const tk=teamKey(t);W.vals[tk]=W.vals[tk]||{};W.vals[tk][ws]=W.vals[tk][ws]||{};W.vals[tk][ws][k]=v;localSave();queueSave(t,ws,k,v)}
function queueSave(t,ws,k,v){
  if(W.mode==='server'){const id=t+'|'+ws+'|'+k;clearTimeout(W.timers[id]);W.pending.add(id);
    W.timers[id]=setTimeout(async()=>{try{const r=await fetch('/api/sheet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({team:teamKey(t),ws,k,v})});
      if(!r.ok)throw 0;setSync('모든 조와 실시간 공유 중')}catch(e){setSync('저장이 늦어지고 있습니다 · 이 기기에는 남아 있습니다')}finally{W.pending.delete(id)}},600);return}
  if(!W.db)return;
  const id=t+'|'+ws+'|'+k;clearTimeout(W.timers[id]);
  W.timers[id]=setTimeout(async()=>{
    const ref=W.db.doc('sheets/'+teamKey(t));const body={[ws]:{[k]:v}};
    try{await ref.update(body)}catch(e){
      if(e&&e.code==='invalid_argument'){try{await ref.set(body)}catch(e2){setSync('저장 실패 · 이 기기에만 남아 있습니다')}}
      else setSync('저장이 늦어지고 있습니다');
    }
  },700);
}
function setSync(t){W.sync=t;const el=document.getElementById('syncState');if(el)el.textContent=t}

/* shared db: worksheets + scoreboard */
(async()=>{
  let db=null;try{db=await window.claude?.use?.('db')}catch(e){}
  if(!db){startServerSync();return}
  W.db=db;W.mode='db';setSync('모든 조와 실시간 공유 중');
  db.collection('sheets').onSnapshot(snap=>{
    snap.docs.forEach(d=>{if(d.exists){const incoming=d.data();const tk=d.id;W.vals[tk]=W.vals[tk]||{};
      for(const ws in incoming){W.vals[tk][ws]=Object.assign({},W.vals[tk][ws]||{},incoming[ws])}}});
    localSave();refreshWsView(true);
  },()=>setSync('연결이 끊겼습니다 · 이 기기에만 저장 중'));
  db.doc('board/scores').onSnapshot(s=>{if(s.exists){const d=s.data();if(Array.isArray(d.s)){S.scores=[...d.s];if(d.teams)S.teams=d.teams;save();renderTeams()}}},()=>{});
})();
W.pending=new Set();W.ver=-1;
async function startServerSync(){
  try{const r=await fetch('/api/state');if(!r.ok)return;W.mode='server';setSync('모든 조와 실시간 공유 중');applyServer(await r.json())}catch(e){return}
  setInterval(async()=>{try{const r=await fetch('/api/state?v='+W.ver);if(r.status===204)return;if(!r.ok)throw 0;applyServer(await r.json());setSync('모든 조와 실시간 공유 중')}catch(e){setSync('서버 연결이 끊겼습니다 · 이 기기에만 저장 중')}},2500);
}
function applyServer(st){
  if(!st||st.v===W.ver)return;W.ver=st.v;
  const sh=st.sheets||{};
  for(const tk in sh){const ti=+tk.replace('team','')-1;W.vals[tk]=W.vals[tk]||{};
    for(const ws in sh[tk]){W.vals[tk][ws]=W.vals[tk][ws]||{};for(const k in sh[tk][ws]){if(W.pending.has(ti+'|'+ws+'|'+k))continue;W.vals[tk][ws][k]=sh[tk][ws][k]}}}
  localSave();refreshWsView(true);
  if(st.scores&&Array.isArray(st.scores.s)&&!W.scorePending){S.scores=[...st.scores.s];if(st.scores.teams)S.teams=st.scores.teams;save();renderTeams()}
}
async function pushScores(){if(W.mode==='server'){W.scorePending=true;try{await fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({s:S.scores,teams:S.teams})})}catch(e){}W.scorePending=false;return}
  if(!W.db)return;try{await W.db.doc('board/scores').set({s:S.scores,teams:S.teams})}catch(e){}}

/* ---- rendering ---- */
function cellVal(t,ws,c){return getV(t,ws,c.k)}
function inputFor(ws,c,t,ro){
  const v=cellVal(t,ws,c);const id=`f-${ws}-${c.k}`;
  if(ro){const a=W.showAns?c.a:v;return `<div class="ro ${W.showAns?'ans':''}">${esc(a)||'<span class="muted">—</span>'}</div>`}
  const ex=W.showEx&&c.a?`<div class="exa">예 · ${esc(c.a)}</div>`:'';
  if(c.t==='num')return `<input class="wi num" id="${id}" data-k="${c.k}" inputmode="decimal" value="${esc(v)}" placeholder="0">${ex}`;
  if(c.t==='area')return `<textarea class="wi" id="${id}" data-k="${c.k}" rows="3">${esc(v)}</textarea>${ex}`;
  return `<input class="wi" id="${id}" data-k="${c.k}" value="${esc(v)}">${ex}`;
}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function num(v){const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}
function renderBlock(ws,b,t,ro){
  if(b.type==='table'){
    const cw=b.w.reduce((a,c)=>a+c,0);
    let h=`<div class="tscroll"><table class="wt"><colgroup>${b.w.map(x=>`<col style="width:${(x/cw*100).toFixed(1)}%">`).join('')}</colgroup><thead><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`;
    b.rows.forEach(r=>{h+='<tr>'+r.map(c=>{
      if(typeof c==='string')return `<td class="fx">${c}</td>`;
      if(c.calc)return `<td class="cv num" data-calc="${c.calc}"></td>`;
      return `<td>${inputFor(ws.id,c,t,ro)}</td>`}).join('')+'</tr>'});
    if(b.calc==='w2')h+=`<tr class="tot"><td class="fx">총점 (25점) · 앱 계산</td><td class="cv num" data-calc="ta"></td><td class="cv num" data-calc="tb"></td><td class="cv num" data-calc="tc"></td><td class="cv" data-calc="tw"></td></tr>`;
    if(b.calc==='w5')h+=`<tr class="tot"><td class="fx" colspan="4">예산 합계 · 앱 계산 (기준 624만 원)</td><td class="cv num" data-calc="bs"></td><td class="cv" data-calc="bw"></td></tr>`;
    if(b.calc==='w01')h+=`<tr class="tot"><td class="fx" colspan="4">규모 + 맞음 합계가 가장 높은 무리 · 앱 계산</td><td class="cv" colspan="2" data-calc="best01"></td></tr>`;
    return h+'</tbody></table></div>';
  }
  if(b.type==='field'){const c={k:b.k,a:b.a,t:b.line?'text':'area'};return `<div class="wf"><label for="f-${ws.id}-${b.k}">${b.label}</label>${inputFor(ws.id,c,t,ro)}</div>`}
  if(b.type==='choice'){const v=ro&&W.showAns?b.a:getV(t,ws.id,b.k);
    return `<div class="wf"><span class="lab">${b.label}</span><div class="seg">${b.opts.map(o=>`<button class="sopt ${v===o?'on':''}" data-choice="${b.k}" data-v="${esc(o)}" ${ro?'disabled':''}>${o}</button>`).join('')}</div>${!ro&&W.showEx?`<div class="exa">예 · ${esc(b.a)}</div>`:''}</div>`}
  if(b.type==='calc'&&b.k==='w42'){
    return `<div class="calcbox"><b>앱이 계산한 값 · 고객 20명 (가상 데이터)</b>
     <div class="calcrow"><span>상위 4명 구매금액 합계</span><span class="num">5,600 + 4,800 + 4,200 + 3,800 = 1억 8,400만원</span></div>
     <div class="calcrow"><span>전체 대비 비중</span><span class="num">18,400 ÷ 39,120 × 100 = 47.0%</span></div>
     <div class="calcrow"><span>하위 4명 구매금액 합계</span><span class="num">520 + 380 + 300 + 150 = 1,350만원 (3.5%)</span></div></div>`}
  if(b.type==='import')return ro?'':`<div class="bar"><button class="btn ghost" id="importBtn">앞 실습에서 쓴 내용 불러오기</button><span class="note">1~6번 칸이 비어 있을 때만 채웁니다. 불러온 뒤 문장으로 다듬으세요.</span></div>`;
  return '';
}
function computeCalcs(root,ws,t){
  const g=(k)=>num(W.showAns&&root.dataset.ro==='1'?findAns(ws,k):getV(t,ws.id,k));
  const set=(k,v)=>root.querySelectorAll(`[data-calc="${k}"]`).forEach(e=>e.innerHTML=v);
  if(ws.id==='w2'){const s=x=>[1,2,3,4,5].reduce((a,i)=>a+g(`s${i}${x}`),0);const a=s('a'),b=s('b'),c=s('c');set('ta',a);set('tb',b);set('tc',c);
    const m=Math.max(a,b,c);const n=['A','B','C'][[a,b,c].indexOf(m)];set('tw',m?`점수로는 <b>${n}</b>가 1순위입니다. 근거 칸이 비어 있으면 미완성입니다.`:'')}
  if(ws.id==='w5'){const s=['v4','g4','r4','n4','s4'].reduce((a,k)=>a+g(k),0);set('bs',s+'만');
    set('bw',s===0?'':s>624?`<span class="warn">${s-624}만 원 초과</span>`:s<624?`${624-s}만 원 남음`:'딱 맞습니다')}
  if(ws.id==='w6'){const base=[4600,2625,880,1338];base.forEach((b,i)=>{const y=g('y'+(i+1)),p=g('p'+(i+1));const l=b*.25*y;const c=l*p/100;
    set('l'+(i+1),y?Math.floor(l).toLocaleString('ko-KR')+'만':'');set('c'+(i+1),y&&p?Math.round(c).toLocaleString('ko-KR')+'만'+(y?` <span class="muted">(1년 ${Math.round(c/y).toLocaleString('ko-KR')}만)</span>`:''):'')})}
  if(ws.id==='w01'){const r=['a','b','c'].map(x=>g(x+'_s')+g(x+'_f'));const m=Math.max(...r);set('best01',m?`<b>${'ABC'[r.indexOf(m)]}</b> 무리 (${m}점)`:'')}
}
function findAns(ws,k){for(const b of ws.blocks){if(b.rows)for(const r of b.rows)for(const c of r)if(c&&c.k===k)return c.a;if(b.k===k)return b.a}return ''}

function wsPage(){
  W.cur=W.cur||'w01';
  $('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="go('home')">← 처음 화면</button><div><p class="step">실습지 쓰기 · 조별로 한 대씩</p><h2>우리 조 실습지</h2></div>
   <p class="sub">우리 조를 고르고 칸을 채우세요. 쓰는 즉시 저장되고, 강사 화면의 "조별 모아보기"에 바로 뜹니다. 합계 · LTV 같은 계산은 앱이 합니다.</p></div>
   <div class="wsbar"><span class="lab">우리 조</span><div class="seg" id="myteam"></div><span class="sync" id="syncState">${W.sync}</span></div>
   <nav class="wstabs" id="wstabs"></nav><section id="wsbody"></section>`;
  const mt=$('#myteam');for(let i=0;i<S.teams;i++){const b=document.createElement('button');b.className='sopt'+(W.myteam===i?' on':'');b.textContent=(i+1)+'조';b.onclick=()=>{W.myteam=i;try{localStorage.setItem('dalkom-myteam',i)}catch(e){}wsPage()};mt.appendChild(b)}
  drawTabs(false);drawWs(false);
}
function drawTabs(ro){
  const n=$('#wstabs');n.innerHTML='';
  WS.forEach(w=>{const b=document.createElement('button');b.className='wtab'+(W.cur===w.id?' on':'');
    const filled=ro?'':progress(W.myteam,w);b.innerHTML=`<span class="num">${w.no}</span> ${w.t}${filled}`;b.onclick=()=>{W.cur=w.id;ro?compareDraw():(drawTabs(false),drawWs(false))};n.appendChild(b)});
}
function keysOf(w){const ks=[];w.blocks.forEach(b=>{if(b.rows)b.rows.forEach(r=>r.forEach(c=>{if(c&&c.k)ks.push(c.k)}));if(b.k&&b.type!=='calc')ks.push(b.k)});return ks}
function progress(t,w){const ks=keysOf(w);const f=ks.filter(k=>String(getV(t,w.id,k)).trim()).length;return ` <span class="prog ${f===ks.length?'full':''}">${f}/${ks.length}</span>`}
function drawWs(){
  const w=WS.find(x=>x.id===W.cur);const t=W.myteam;
  const body=$('#wsbody');
  body.innerHTML=`<div class="wshead"><div><h3>${w.no} · ${w.t}</h3><p class="muted">${w.sub}</p></div><span class="pill">${w.time}</span></div>
   ${guideHTML(GUIDE[w.id],true)}
   <div class="exbar"><label class="tog"><input type="checkbox" id="exTog" ${W.showEx?'checked':''}> 칸마다 예시 답 보기</label><button class="btn ghost" id="fillEx">예시로 빈칸 채우기 (강사 시연용)</button><span class="note">예시는 참고용입니다. 우리 조 생각으로 바꿔 쓰세요.</span></div>
   ${w.tip?`<p class="tipline">${w.tip}</p>`:''}${w.blocks.map(b=>renderBlock(w,b,t,false)).join('')}`;
  body.dataset.ro='0';
  body.querySelectorAll('.wi').forEach(el=>el.addEventListener('input',e=>{setV(t,w.id,e.target.dataset.k,e.target.value);computeCalcs(body,w,t);drawTabsSoft()}));
  body.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{setV(t,w.id,el.dataset.choice,el.dataset.v);body.querySelectorAll(`[data-choice="${el.dataset.choice}"]`).forEach(x=>x.classList.toggle('on',x===el))});
  const ib=$('#importBtn');if(ib)ib.onclick=()=>doImport(t);
  $('#exTog').onchange=e=>{W.showEx=e.target.checked;const op=body.querySelector('details.guide')?.open;drawWs();const d=$('#wsbody details.guide');if(d&&op===false)d.open=false};
  $('#fillEx').onclick=()=>{let n=0;w.blocks.forEach(b=>{if(b.rows)b.rows.forEach(r=>r.forEach(c=>{if(c&&c.k&&c.a&&!String(getV(t,w.id,c.k)).trim()){setV(t,w.id,c.k,c.a);n++}}));if((b.type==='field'||b.type==='choice')&&!String(getV(t,w.id,b.k)).trim()){setV(t,w.id,b.k,b.a);n++}});drawWs();toast(n?`${t+1}조 실습지에 예시 ${n}칸을 채웠습니다`:'빈칸이 없습니다')};
  computeCalcs(body,w,t);
}
function drawTabsSoft(){document.querySelectorAll('#wstabs .wtab').forEach((b,i)=>{const p=b.querySelector('.prog');if(p){const w=WS[i];const tmp=document.createElement('span');tmp.innerHTML=progress(W.myteam,w);p.replaceWith(tmp.firstElementChild)}})}
function refreshWsView(fromRemote){
  if($('#compareBody'))compareDraw();
  const body=$('#wsbody');if(!body||!fromRemote)return;
  const w=WS.find(x=>x.id===W.cur);
  body.querySelectorAll('.wi').forEach(el=>{if(document.activeElement===el)return;const v=getV(W.myteam,w.id,el.dataset.k);if(el.value!==String(v))el.value=v});
  body.querySelectorAll('[data-choice]').forEach(el=>el.classList.toggle('on',getV(W.myteam,w.id,el.dataset.choice)===el.dataset.v));
  computeCalcs(body,w,W.myteam);drawTabsSoft();
}
function doImport(t){
  const g=(ws,k)=>String(getV(t,ws,k)||'').trim();
  const pick=g('w1','best');const segs=['d_s','g_s','b_s','p_s'].map(k=>g('w1',k)).filter(Boolean);
  const nm={a:g('w2','na')||'A',b:g('w2','nb')||'B',c:g('w2','nc')||'C'};
  const tot=x=>[1,2,3,4,5].reduce((a,i)=>a+num(getV(t,'w2',`s${i}${x}`)),0);
  const T3={a:tot('a'),b:tot('b'),c:tot('c')};const top=Object.keys(T3).sort((p,q)=>T3[q]-T3[p])[0];
  const r={
   r1:pick?pick:(segs[0]||''),
   r2:T3[top]?`${nm[top]} 세그먼트를 1순위로 선정했습니다(25점 중 ${T3[top]}점). 전략: ${g('w2','strat')||'-'}. ${g('w2','why')}`:'',
   r3:'',
   r4:[g('w42','v_c')&&`최우수: ${g('w42','v_c')}`,g('w42','r_c')&&`이탈 위험: ${g('w42','r_c')}`,g('w42','read')].filter(Boolean).join(' / '),
   r5:['v2','g2','r2','n2','s2'].map((k,i)=>g('w5',k)&&`${['VIP','우수 단골','이탈 위험','일반','휴면'][i]} · ${g('w5',k)}`).filter(Boolean).join(' / '),
   r6:(()=>{const b=['v4','g4','r4','n4','s4'].map(k=>num(getV(t,'w5',k)));const s=b.reduce((a,c)=>a+c,0);return s?`총 ${s}만 원 = ${['VIP','우수 단골','이탈 위험','일반','휴면'].map((n,i)=>`${n} ${b[i]}만(${Math.round(b[i]/s*100)}%)`).join(' · ')}`:''})()};
  let n=0;for(const k in r){if(r[k]&&!String(getV(t,'w7',k)).trim()){setV(t,'w7',k,r[k]);n++}}
  drawWs();toast(n?`${n}칸을 불러왔습니다`:'불러올 내용이 없거나 이미 채워져 있습니다');
}

/* ---- instructor compare ---- */
function comparePage(){
  $('#app').innerHTML=`<div class="screen-head"><button class="back" onclick="go('teacher')">← 강사 화면</button><div><p class="step">강사 화면 · ③ 조별 모아보기</p><h2>조별 모아보기</h2></div>
   <p class="sub">실습지를 고르면 ${S.teams}개 조가 쓴 내용이 칸별로 나란히 뜹니다. 쓰는 대로 실시간으로 바뀝니다. 예시 답안은 필요할 때만 켜세요.</p></div>
   <div class="wsbar"><label class="tog"><input type="checkbox" id="ansTog" ${W.showAns?'checked':''}> 예시 답안 열 보이기</label><span class="sync" id="syncState">${W.sync}</span></div>
   <nav class="wstabs" id="wstabs"></nav><section id="compareBody"></section>`;
  $('#ansTog').onchange=e=>{W.showAns=e.target.checked;compareDraw()};
  drawTabs(true);compareDraw();
}
function compareDraw(){
  const w=WS.find(x=>x.id===W.cur);const box=$('#compareBody');if(!box)return;
  document.querySelectorAll('#wstabs .wtab').forEach((b,i)=>b.classList.toggle('on',WS[i].id===W.cur));
  const rows=[];
  w.blocks.forEach(b=>{
    if(b.type==='table')b.rows.forEach(r=>r.forEach((c,ci)=>{if(c&&c.k)rows.push({label:`${typeof r[0]==='string'?r[0]:''} · ${b.head[ci]}`,k:c.k,a:c.a,num:c.t==='num'})}));
    if(b.type==='field'||b.type==='choice')rows.push({label:b.label,k:b.k,a:b.a});
  });
  const cols=[...Array(S.teams).keys()];
  let h=`<div class="tscroll"><table class="ct"><thead><tr><th style="width:16%">칸</th>${cols.map(i=>`<th style="width:${((W.showAns?60:84)/S.teams).toFixed(1)}%">${i+1}조 ${progress(i,w)}</th>`).join('')}${W.showAns?'<th class="ansh" style="width:24%">예시 답안</th>':''}</tr></thead><tbody>`;
  rows.forEach(r=>{h+=`<tr><td class="fx">${r.label}</td>${cols.map(i=>{const v=getV(i,w.id,r.k);return `<td class="${r.num?'num':''}">${esc(v)||'<span class="muted">—</span>'}</td>`}).join('')}${W.showAns?`<td class="ansc">${esc(r.a)}</td>`:''}</tr>`});
  box.innerHTML=`<div class="wshead"><div><h3>${w.no} · ${w.t}</h3><p class="muted">${w.sub}</p></div><span class="pill">${w.time}</span></div>`+h+'</tbody></table></div>';
}

renderTeams();home();
</script>
